<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Express benchmark compare</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e11;
    --bg2: #16161a;
    --bg3: #1e1e24;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8e8f0;
    --text2: #888899;
    --text3: #555566;
    --accent: #7c6dfa;
    --accent2: #a78bfa;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --teal: #22d3ee;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  header span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
  }

  main { padding: 32px; max-width: 1100px; margin: 0 auto; flex: 1 }

  .drop-zone {
    border: 1.5px dashed var(--border2);
    border-radius: 12px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 32px;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(124,109,250,0.05);
  }
  .drop-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .drop-icon {
    font-size: 28px;
    margin-bottom: 12px;
    color: var(--text3);
  }
  .drop-title {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .drop-hint { font-size: 12px; color: var(--text3); }

  .file-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 32px;
    overflow-x: auto;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .pill-name { color: var(--text); }
  .pill-override { color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill-remove {
    cursor: pointer;
    color: var(--text3);
    background: none;
    border: none;
    font-size: 14px;
    line-height: 1;
    padding: 0 0 0 4px;
    transition: color 0.15s;
  }
  .pill-remove:hover { color: var(--red); }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 16px;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 12px;
    margin-bottom: 40px;
  }

  .metric-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .metric-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  .metric-rows { display: flex; flex-direction: column; gap: 6px; }
  .metric-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .metric-run {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .metric-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .metric-val {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }
  .badge-best {
    font-family: var(--mono);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(52,211,153,0.12);
    color: var(--green);
    border: 1px solid rgba(52,211,153,0.25);
    white-space: nowrap;
  }
  .badge-base {
    font-family: var(--mono);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(124,109,250,0.15);
    color: var(--accent2);
    border: 1px solid rgba(124,109,250,0.3);
    white-space: nowrap;
  }
  .pill-setbase {
    cursor: pointer;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .pill-setbase:hover { color: var(--accent2); border-color: rgba(124,109,250,0.4); }
  .delta-pos { font-family: var(--mono); font-size: 10px; color: var(--green); white-space: nowrap; }
  .delta-neg { font-family: var(--mono); font-size: 10px; color: var(--red); white-space: nowrap; }
  .delta-neu { font-family: var(--mono); font-size: 10px; color: var(--text3); white-space: nowrap; }

  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .chart-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 180px;
  }
  .metric-card-chart {
    position: relative;
    width: 100%;
    height: 200px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .latency-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 40px;
  }
  .percentile-wrap {
    position: relative;
    width: 100%;
    height: 220px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
  }
  .legend-sq {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .table-wrap {
    overflow-x: auto;
    margin-bottom: 40px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }
  th {
    text-align: left;
    padding: 10px 14px;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    font-weight: 400;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td.val { color: var(--text); }
  td.best { color: var(--green); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .empty-state {
    text-align: center;
    padding: 60px 0;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 13px;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .footer-sep {
    width: 1px;
    height: 12px;
    background: var(--border2);
  }
  .footer-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .footer-text strong { color: var(--text2); font-weight: 500; }
  footer a {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    text-decoration: none;
    transition: color 0.15s;
  }
  footer a:hover { color: var(--accent2); }
  footer a svg { flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>bench-compare</h1>
  <span>@expressjs/perf</span>
</header>

<main>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".json" multiple>
    <div class="drop-icon">&#8659;</div>
    <div class="drop-title">Drop JSON benchmark files here</div>
    <div class="drop-hint">or click to browse — select multiple files at once</div>
  </div>

  <div class="file-pills" id="filePills"></div>

  <div id="dashboard">
    <div class="empty-state" id="emptyState">Load at least one benchmark JSON to see results</div>
  </div>
</main>

<footer>
  <span class="footer-text">Open-Source Project by <a href="https://github.com/GroophyLifefor" target="_blank" rel="noopener">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
    Murat Kirazkaya
  </a> for Express.js Perf WG</span>
  <span class="footer-sep"></span>
  <a href="https://github.com/GroophyLifefor/expressjs-benchmark-dashboard" target="_blank" rel="noopener">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
    expressjs-benchmark-dashboard
  </a>
  
</footer>

<script>
const PALETTE = ['#7c6dfa','#34d399','#fbbf24','#22d3ee','#f87171','#a78bfa','#6ee7b7','#fde68a'];
const CHART_GRID = 'rgba(255,255,255,0.05)';
const TICK_COLOR = '#555566';

let runs = [];
let charts = [];
let baseIdx = 0;

function colorFor(i) { return PALETTE[i % PALETTE.length]; }

function labelFor(run) {
  return run._filename || 'run';
}

function cr(run) { return run.clientResults?.[0] || {}; }

function fmtNum(n, decimals = 0) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return decimals > 0 ? n.toFixed(decimals) : Math.round(n).toLocaleString();
}

function fmtBytes(n) {
  if (!n) return '—';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + ' MB/s';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + ' KB/s';
  return Math.round(n) + ' B/s';
}

function bestIdx(vals, lowerBetter = false) {
  if (vals.length < 2) return -1;
  let best = 0;
  for (let i = 1; i < vals.length; i++) {
    if (vals[i] === undefined) continue;
    if (lowerBetter ? vals[i] < vals[best] : vals[i] > vals[best]) best = i;
  }
  return best;
}

function destroyCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

function mkChart(id, type, data, opts = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  const c = new Chart(el, { type, data, options: { responsive: true, maintainAspectRatio: false, ...opts } });
  charts.push(c);
}

function commonChartOpts(yFmt) {
  return {
    plugins: { legend: { display: false }, tooltip: {
      backgroundColor: '#1e1e24',
      borderColor: 'rgba(255,255,255,0.1)',
      borderWidth: 1,
      titleColor: '#888899',
      bodyColor: '#e8e8f0',
      titleFont: { family: "'IBM Plex Mono'" },
      bodyFont: { family: "'IBM Plex Mono'", size: 12 },
      padding: 10
    }},
    scales: {
      x: { ticks: { color: TICK_COLOR, font: { family: "'IBM Plex Mono'", size: 10 }, maxRotation: 20 }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.08)' } },
      y: { ticks: { color: TICK_COLOR, font: { family: "'IBM Plex Mono'", size: 10 }, callback: yFmt }, grid: { color: CHART_GRID }, border: { display: false } }
    }
  };
}

function render() {
  destroyCharts();
  const dash = document.getElementById('dashboard');
  const empty = document.getElementById('emptyState');

  if (runs.length === 0) {
    dash.innerHTML = '<div class="empty-state" id="emptyState">Load at least one benchmark JSON to see results</div>';
    return;
  }

  empty && (empty.style.display = 'none');

  const labels = runs.map(labelFor);
  const colors = runs.map((_, i) => colorFor(i));

  const reqAvg = runs.map(r => cr(r).requests?.average);
  const latAvg = runs.map(r => cr(r).latency?.average);
  const latStd = runs.map(r => cr(r).latency?.stddev);
  const tputAvg = runs.map(r => cr(r).throughput?.average);
  const lat99 = runs.map(r => cr(r).latency?.p99);
  const lat999 = runs.map(r => cr(r).latency?.p99_9);
  const bestReq = bestIdx(reqAvg);
  const bestLat = bestIdx(latAvg, true);
  const bestStd = bestIdx(latStd, true);
  const bestTput = bestIdx(tputAvg);

  function metricRows(vals, fmt, lowerBetter = false) {
    const best = bestIdx(vals, lowerBetter);
    const baseVal = vals[baseIdx];
    return runs.map((r, i) => {
      const v = vals[i];
      const isBest = i === best && runs.length > 1;
      let deltaHtml = '';
      if (i !== baseIdx && baseVal != null && v != null && baseVal !== 0) {
        const pct = (v - baseVal) / baseVal * 100;
        const improved = lowerBetter ? pct < 0 : pct > 0;
        const cls = Math.abs(pct) < 0.05 ? 'delta-neu' : (improved ? 'delta-pos' : 'delta-neg');
        deltaHtml = `<span class="${cls}">${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</span>`;
      }
      return `<div class="metric-row">
        <div class="metric-run"><span class="metric-dot" style="background:${colors[i]}"></span>${labels[i]}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="metric-val">${fmt(v)}</span>
          ${deltaHtml}
          ${isBest ? '<span class="badge-best">better</span>' : ''}
        </div>
      </div>`;
    }).join('');
  }

  dash.innerHTML = `
    <div class="section-label">summary</div>
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-label">avg req/s</div>
        <div class="metric-rows">${metricRows(reqAvg, v => fmtNum(v))}</div>
        <div class="metric-card-chart"><canvas id="cReq" role="img" aria-label="Average requests per second by run"></canvas></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">avg latency</div>
        <div class="metric-rows">${metricRows(latAvg, v => fmtNum(v, 2) + ' ms', true)}</div>
        <div class="metric-card-chart"><canvas id="cLat" role="img" aria-label="Average latency in ms by run"></canvas></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">latency stddev</div>
        <div class="metric-rows">${metricRows(latStd, v => fmtNum(v, 2) + ' ms', true)}</div>
        <div class="metric-card-chart"><canvas id="cStd" role="img" aria-label="Latency standard deviation by run"></canvas></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">throughput</div>
        <div class="metric-rows">${metricRows(tputAvg, fmtBytes)}</div>
        <div class="metric-card-chart"><canvas id="cTput" role="img" aria-label="Average throughput by run"></canvas></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">p99 latency</div>
        <div class="metric-rows">${metricRows(lat99, v => fmtNum(v, 0) + ' ms', true)}</div>
        <div class="metric-card-chart"><canvas id="cP99" role="img" aria-label="p99 latency by run"></canvas></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">p99.9 latency</div>
        <div class="metric-rows">${metricRows(lat999, v => fmtNum(v, 0) + ' ms', true)}</div>
        <div class="metric-card-chart"><canvas id="cP999" role="img" aria-label="p99.9 latency by run"></canvas></div>
      </div>
    </div>

    <div class="latency-card">
      <div class="chart-title">latency percentiles (ms)</div>
      <div class="percentile-wrap"><canvas id="cPerc" role="img" aria-label="Latency percentile distribution by run"></canvas></div>
      <div class="legend" id="percLegend"></div>
    </div>

    <div class="section-label">full stats</div>
    <div class="table-wrap">${buildTable(labels, colors)}</div>
  `;

  const barDs = (vals, label) => ({
    label,
    data: vals,
    backgroundColor: colors,
    borderColor: colors.map(c => c + 'aa'),
    borderWidth: 1,
    borderRadius: 4
  });

  mkChart('cReq', 'bar',
    { labels, datasets: [barDs(reqAvg, 'req/s')] },
    commonChartOpts(v => Math.round(v).toLocaleString())
  );
  mkChart('cLat', 'bar',
    { labels, datasets: [barDs(latAvg, 'ms')] },
    commonChartOpts(v => v.toFixed(2))
  );
  mkChart('cTput', 'bar',
    { labels, datasets: [barDs(tputAvg.map(v => v ? +(v / 1e6).toFixed(3) : 0), 'MB/s')] },
    commonChartOpts(v => v.toFixed(2) + ' MB/s')
  );
  mkChart('cStd', 'bar',
    { labels, datasets: [barDs(latStd, 'ms')] },
    commonChartOpts(v => v.toFixed(2))
  );
  mkChart('cP99', 'bar',
    { labels, datasets: [barDs(lat99, 'ms')] },
    commonChartOpts(v => Math.round(v) + ' ms')
  );
  mkChart('cP999', 'bar',
    { labels, datasets: [barDs(lat999, 'ms')] },
    commonChartOpts(v => Math.round(v) + ' ms')
  );

  const percKeys = ['p1','p2_5','p10','p25','p50','p75','p90','p97_5','p99','p99_9','p99_99'];
  const percLabels = ['p1','p2.5','p10','p25','p50','p75','p90','p97.5','p99','p99.9','p99.99'];
  const percDs = runs.map((r, i) => ({
    label: labels[i],
    data: percKeys.map(k => cr(r).latency?.[k] ?? null),
    borderColor: colors[i],
    backgroundColor: colors[i] + '22',
    borderWidth: 2,
    pointRadius: 3,
    pointHoverRadius: 5,
    fill: false,
    tension: 0.3
  }));
  mkChart('cPerc', 'line',
    { labels: percLabels, datasets: percDs },
    { ...commonChartOpts(v => v + ' ms'), plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#1e1e24', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
        titleColor: '#888899', bodyColor: '#e8e8f0',
        titleFont: { family: "'IBM Plex Mono'" }, bodyFont: { family: "'IBM Plex Mono'", size: 12 }, padding: 10
      }}}
  );

  const legendEl = document.getElementById('percLegend');
  if (legendEl) {
    legendEl.innerHTML = runs.map((r, i) =>
      `<span class="legend-item"><span class="legend-sq" style="background:${colors[i]}"></span>${labels[i]}</span>`
    ).join('');
  }

}

function buildTable(labels, colors) {
  const cols = [
    { key: r => cr(r).requests?.average, label: 'avg req/s', fmt: v => fmtNum(v), lowerBetter: false },
    { key: r => cr(r).requests?.min, label: 'min req/s', fmt: v => fmtNum(v), lowerBetter: false },
    { key: r => cr(r).requests?.max, label: 'max req/s', fmt: v => fmtNum(v), lowerBetter: false },
    { key: r => cr(r).requests?.stddev, label: 'req stddev', fmt: v => fmtNum(v), lowerBetter: true },
    { key: r => cr(r).latency?.average, label: 'avg lat ms', fmt: v => fmtNum(v, 2), lowerBetter: true },
    { key: r => cr(r).latency?.stddev, label: 'lat stddev', fmt: v => fmtNum(v, 2), lowerBetter: true },
    { key: r => cr(r).latency?.p50, label: 'p50 ms', fmt: v => fmtNum(v), lowerBetter: true },
    { key: r => cr(r).latency?.p99, label: 'p99 ms', fmt: v => fmtNum(v), lowerBetter: true },
    { key: r => cr(r).latency?.p99_9, label: 'p99.9 ms', fmt: v => fmtNum(v), lowerBetter: true },
    { key: r => cr(r).latency?.max, label: 'max lat ms', fmt: v => fmtNum(v), lowerBetter: true },
    { key: r => cr(r).throughput?.average, label: 'throughput', fmt: fmtBytes, lowerBetter: false },
    { key: r => cr(r).errors, label: 'errors', fmt: v => fmtNum(v), lowerBetter: true },
    { key: r => cr(r).duration, label: 'duration s', fmt: v => fmtNum(v, 1), lowerBetter: false },
    { key: r => cr(r)['2xx'], label: '2xx total', fmt: v => fmtNum(v), lowerBetter: false },
  ];

  const rows = cols.map(col => {
    const vals = runs.map(col.key);
    const best = bestIdx(vals, col.lowerBetter);
    const baseVal = vals[baseIdx];
    const cells = runs.map((r, i) => {
      const v = vals[i];
      const isBest = i === best && runs.length > 1;
      let deltaStr = '';
      if (i !== baseIdx && baseVal != null && v != null && baseVal !== 0) {
        const pct = (v - baseVal) / baseVal * 100;
        const improved = col.lowerBetter ? pct < 0 : pct > 0;
        const cls = Math.abs(pct) < 0.05 ? 'delta-neu' : (improved ? 'delta-pos' : 'delta-neg');
        deltaStr = ` <span class="${cls}">${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</span>`;
      }
      return `<td class="${isBest ? 'better' : 'val'}">${col.fmt(v)}${deltaStr}</td>`;
    }).join('');
    return `<tr><td>${col.label}</td>${cells}</tr>`;
  }).join('');

  const headers = labels.map((l, i) =>
    `<th><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colors[i]};margin-right:6px;vertical-align:middle"></span>${l}</th>`
  ).join('');

  return `<table>
    <thead><tr><th>metric</th>${headers}</tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function loadFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        data._filename = file.name.replace(/\.json$/, '');
        resolve(data);
      } catch { reject(new Error('Invalid JSON: ' + file.name)); }
    };
    reader.onerror = () => reject(new Error('Could not read: ' + file.name));
    reader.readAsText(file);
  });
}

function updatePills() {
  const el = document.getElementById('filePills');
  el.innerHTML = runs.map((r, i) => {
    const ov = r.options?.overrides?.express || '—';
    const isBase = i === baseIdx;
    return `<div class="pill">
      <span class="pill-dot" style="background:${colorFor(i)}"></span>
      <span class="pill-name">${r._filename}</span>
      <span class="pill-override">${ov}</span>
      ${isBase
        ? '<span class="badge-base">base</span>'
        : `<button class="pill-setbase" data-idx="${i}" title="Set as base">set base</button>`}
      <button class="pill-remove" data-idx="${i}" title="Remove">&#x2715;</button>
    </div>`;
  }).join('');

  el.querySelectorAll('.pill-setbase').forEach(btn => {
    btn.addEventListener('click', () => {
      baseIdx = +btn.dataset.idx;
      updatePills();
      render();
    });
  });

  el.querySelectorAll('.pill-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      runs.splice(idx, 1);
      if (baseIdx >= runs.length) baseIdx = 0;
      else if (idx < baseIdx) baseIdx--;
      updatePills();
      render();
    });
  });
}

async function handleFiles(files) {
  const fileArr = Array.from(files);
  const loaded = await Promise.all(fileArr.map(loadFile));
  runs.push(...loaded);
  updatePills();
  render();
}

const dz = document.getElementById('dropZone');
const fi = document.getElementById('fileInput');

fi.addEventListener('change', () => { if (fi.files.length) handleFiles(fi.files); fi.value = ''; });

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
</script>
</body>
